name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Syntax Check
      run: |
        node -c src/proxy.js
        node -c scripts/server-multikey.js
        node -c scripts/check-models.js
        node -c test/test-proxy.js

    - name: Run Automated Test Suite
      run: npm test
